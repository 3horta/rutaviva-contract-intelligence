name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same image as Compose. Published on 5433, the port the default Settings use.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rutaviva
          POSTGRES_PASSWORD: rutaviva
          POSTGRES_DB: rutaviva
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rutaviva -d rutaviva"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrate (upgrade, downgrade, upgrade, drift check)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        # REQUIRE_DB=1: integration tests fail instead of being skipped when Postgres is
        # unreachable, so a green run always means the isolation tests actually ran.
        env:
          REQUIRE_DB: "1"
        run: uv run pytest -ra

      # The frontend's types come from the committed frontend/openapi.json (ADR-F05):
      # it must be what the backend code produces.
      - name: OpenAPI document is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # schema.d.ts must be what openapi-typescript makes of the committed openapi.json.
      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End to end (Compose stack, evaluation, traces)
    # The whole system as a reviewer runs it: `docker compose up --build` with no .env,
    # the keyless providers (fake LLM, local BGE embeddings), the sample PDFs and the
    # verification questions. Slower than the other jobs (it builds the images).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 5
          done
          docker compose ps -a
          exit 1

      # Uploads the sample PDFs, waits for them, asks every question and exits 1 if a
      # non-soft case fails.
      - name: Evaluation (sample_data/questions.yaml)
        shell: bash
        run: make eval 2>&1 | grep -v '^{"timestamp' | tee eval.log

      - name: Broken PDFs fail with their codes
        run: |
          grep -F "failed  corrupted_contract.pdf: corrupt_pdf" eval.log
          grep -F "failed  scanned_lease_addendum_no_text.pdf: empty_pdf" eval.log

      # With nosniff, a module worker served with a non-JavaScript type does not run, and
      # the PDF viewer shows "could not be displayed". Unit tests do not go through nginx.
      - name: PDF.js worker is served as JavaScript
        run: |
          worker=$(docker compose exec -T web sh -c 'ls /usr/share/nginx/html/assets | grep "^pdf.worker"')
          curl -fsSI "http://localhost:8080/assets/$worker" | tee /dev/stderr | grep -qi '^content-type: text/javascript'

      - name: Traces (upload crosses API and worker; query links to its ingestion)
        run: python3 backend/scripts/check_traces.py

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 api worker migrate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-log
          path: eval.log
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
