[project]
name = "rutaviva-backend"
version = "0.1.0"
description = "API and worker for Rutaviva Contract Intelligence"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-celery>=0.51b0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-sdk>=1.30",
    "pdfplumber==0.11.10",
    # pdfplumber needs pypdfium2>=5.9; 5.11 is the newest with a macOS 12 Intel wheel
    # (5.12+ need macOS 13), so the backend still installs on older Intel Macs.
    "pypdfium2==5.11.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Local ML: Docling (text extraction) and the embedding model (sentence-transformers),
# both on PyTorch. They run in the single backend image (api and worker). PyTorch has no
# wheels for every desktop platform (e.g. macOS on Intel after 2.2.2), so this group is
# only installed on Linux: in Docker and in CI. Locally the tests use the simulated
# embedder and skip the Docling and model tests.
ml = [
    "docling==2.140.0; sys_platform == 'linux'",
    "sentence-transformers==6.1.0; sys_platform == 'linux'",
    # Declared directly (not only through docling) so that [tool.uv.sources] applies
    # and they come from the CPU-only index.
    "torch; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
]
spike = [
    "cryptography<49",
    "google-genai>=1.30",
    "litellm>=1.80",
]

[tool.uv]
package = false
default-groups = ["dev", "ml"]

# CPU-only PyTorch on Linux: the default wheels bundle CUDA and add gigabytes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The migrations folder has the same name as the package: without this, ruff treats it as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette recommends httpx2 for its TestClient; httpx is kept as the well-known
    # standard. Only this specific warning is silenced.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
