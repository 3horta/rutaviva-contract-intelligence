# Starts without .env: every value has a default that works in fake mode.
name: rutaviva

x-backend-env: &backend-env
  # App role, subject to RLS. The initial migration creates it with these
  # credentials. The owner (POSTGRES_USER) will only be used by the `migrate` service.
  DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-rutaviva_app}:${APP_DB_PASSWORD:-rutaviva_app}@db:5432/${POSTGRES_DB:-rutaviva}
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rutaviva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rutaviva}
      POSTGRES_DB: ${POSTGRES_DB:-rutaviva}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
