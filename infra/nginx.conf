# Serves the built SPA and proxies the API, so the browser only ever talks to
# one origin (no CORS). Installed as /etc/nginx/conf.d/default.conf by
# frontend/Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 20 MB by the API; leave room for multipart overhead.
    client_max_body_size 25m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Streamed answers (Server-Sent Events): no buffering, long-lived connection.
    location = /api/query/stream {
        proxy_pass http://api:8000/query/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # /api/documents -> http://api:8000/documents (the trailing slash strips /api).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Stream uploads to the API instead of spooling them to disk first.
        proxy_request_buffering off;
    }

    # Hashed build assets (and the PDF.js worker) never change: cache for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes (/documents/123) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
