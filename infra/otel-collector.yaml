# OpenTelemetry Collector: receives OTLP from the API and the worker, forwards the traces
# to Jaeger and exposes the metrics for Prometheus (ADR-020). The apps only know the
# collector, so the backends can change here without touching their configuration.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuse data before running out of memory, instead of being OOM-killed.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}

exporters:
  # Jaeger v2 accepts OTLP natively.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics in Prometheus text format at :8889/metrics, for any Prometheus to scrape.
  # `service.name` becomes the `job` label and `service.instance.id` the `instance`
  # label, so each process keeps its own series. Series of a process that stopped
  # reporting disappear after `metric_expiration` (default 5m).
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
