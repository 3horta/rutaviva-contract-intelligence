# Real public contracts used to calibrate (and then evaluate) the keyless answer mode.
#
# The PDFs are NOT in this repository: they are public procurement records and terms
# published by US state/county governments and carriers, but their reuse terms were not
# reviewed, so only their source is recorded here. To reproduce the calibration, download
# each `source_url` into a local folder (default: var/calibration-contracts/, which
# git ignores) with the given `file` name and check its `sha256`; the verifier
# (verify_questions.py) refuses a file whose hash does not match.
#
# Split BY DOCUMENT, never by question: thresholds are tuned only on `calibration`
# documents; `eval` documents are held out and used once, at the end. Documents that
# share a template (the two State of Maine repair master agreements; the two State of
# Missouri fuel card contracts) are kept in the same set, so boilerplate shared between
# them cannot leak from calibration into evaluation.
